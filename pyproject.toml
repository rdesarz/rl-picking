[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "so101-grasp"
version = "0.1.0"
description = "Isaac Lab SO-101 cube grasp-and-lift environments for state and vision policies."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab==3.0.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[project.optional-dependencies]
isaacsim = ["isaaclab[isaacsim]"]
ovphysx = ["ovphysx"]
ovrtx = ["ovrtx", "ovstage"]
video = ["isaaclab[video]"]

[project.entry-points."isaaclab.tasks"]
so101_grasp = "so101_grasp.tasks"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
isaaclab = { git = "https://github.com/isaac-sim/IsaacLab.git", branch = "release/3.0.0", subdirectory = "tools/wheel_builder" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.build-backend]
module-name = "so101_grasp"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
